name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  IMAGE_NAME: ghcr.io/namit2405/endpoint-sentinel

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/src/frontend/pnpm-lock.yaml
      - name: Install Python dependencies
        run: python -m pip install -r Backend/requirements.txt
      - name: Django checks
        working-directory: Backend
        env:
          SECRET_KEY: ci-only-secret
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          HEARTBEAT_API_KEY: ci-only-heartbeat-key
          CSRF_TRUSTED_ORIGINS: http://localhost:8001
          CORS_ALLOWED_ORIGINS: http://localhost:8001
        run: |
          python manage.py check
          python manage.py migrate --noinput
      - name: Frontend typecheck
        working-directory: frontend/src/frontend
        run: |
          pnpm install --frozen-lockfile
          ./node_modules/.bin/tsc --noEmit
          ./node_modules/.bin/vite build

  merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Enable automatic squash merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest image over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/endpoint-sentinel
            echo '${{ secrets.GHCR_READ_TOKEN }}' | docker login ghcr.io -u '${{ secrets.GHCR_USERNAME }}' --password-stdin
            docker compose -f compose.production.yml pull endpoint-sentinel
            docker compose -f compose.production.yml up -d --remove-orphans endpoint-sentinel
            docker image prune -f
