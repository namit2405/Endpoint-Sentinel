[supervisord]
nodaemon=true
user=root

[program:gunicorn]
directory=/app/Backend
command=gunicorn core.wsgi:application --bind 127.0.0.1:8002 --workers 3 --access-logfile - --error-logfile -
autostart=true
autorestart=true
priority=10

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
